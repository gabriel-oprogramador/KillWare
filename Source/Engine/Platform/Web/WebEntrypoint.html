<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <title>GT-Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      outline: none;
    }

    #hidden-text {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: auto;
      border: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
    }
  </style>
</head>

<body>
  <div id="game-container">
    <canvas id="canvas" tabindex="0"></canvas>
    <input id="hidden-text" type="text" autocomplete="off" spellcheck="false">
  </div>

  <script src="index.js"></script>
  <script>
    const canvas = document.getElementById("canvas");
    const container = document.getElementById("game-container");
    const hiddenText = document.getElementById("hidden-text");

    // Bloquear menu de contexto
    canvas.addEventListener("contextmenu", e => e.preventDefault());

  </script>
</body>

</html>
